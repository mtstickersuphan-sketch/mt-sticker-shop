<title>ระบบร้านป้าย</title>

<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Back-office console: dark ink panels, red as the brand/active colour, blue = income & work in progress, green = ready/paid. Sidebar on desktop, bottom bar on phone. */
:root{color-scheme:dark;--bg:#080C14;--panel:#0E1522;--panel2:#131D2E;--line:#1F2B40;--tx:#EAF0FA;--mut:#93A2BA;--red:#E11D2E;--red-soft:rgba(225,29,46,.16);--onred:#FFFFFF;--blue:#4C8DFF;--green:#2FD07A;--purple:#A78BFA;--orange:#F5A524;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);--f:'Anuphan','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:1440px;margin:0 auto;padding-block:14px 110px}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;min-width:0}
button{cursor:pointer}
.shell{display:block}
.side{display:none}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.wm{font-style:italic;font-weight:700;letter-spacing:-.02em;font-size:22px;line-height:1.1;white-space:nowrap}
.wm b{color:var(--red);font-weight:700;margin-right:6px;font-size:1.25em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:14px;min-width:0}
.top h1{font-size:24px;line-height:1.25}
.mwm{display:block}
.tr{display:flex;align-items:center;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;color:var(--mut);white-space:nowrap}
.who{background:var(--red-soft);border:1px solid var(--red);color:var(--tx);border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.icb{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--mut)}
.icb.sm{min-width:36px;min-height:36px}

.tile.on small,.tile.on .tl{color:var(--tx)}
@media(max-width:700px){.tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:10px;gap:8px}.tile .ico{width:38px;height:38px}.tile b{font-size:22px}}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld,.sel{min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--tx)}
.fld{width:100%}
.bar .fld{flex:1;min-width:200px}
.kpi{font-family:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}.pst{font-family:inherit;background:none;border:0;cursor:pointer}
.ntb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;color:inherit;background:none;border:0;border-radius:12px;padding:6px;cursor:pointer}.nt .ntb{border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;font-size:14px}.nt .ntb:last-child{border:0}.ntb:hover{background:var(--panel2)}
.kbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:14px;background:linear-gradient(135deg,#FFB020,#F28C00);color:#2A1700;font:700 15px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(245,165,36,.35)}.kbtn:active{transform:scale(.97)}
.bigadd{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:68px;border:0;border-radius:18px;background:linear-gradient(135deg,#FF3B4E,#D4122A);color:#fff;font:700 21px/1 inherit;font-family:inherit;box-shadow:0 8px 24px rgba(230,30,50,.38),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer}.bigadd:active{transform:scale(.98)}.bigadd svg{width:28px;height:28px}
.list.rows{grid-template-columns:1fr;max-width:860px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.top2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top2 b{font-size:17px;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:13px}.mut a{color:var(--blue)}
.late{color:var(--red);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:2px 0}
.seg span{height:6px;border-radius:3px;background:var(--line)}
.seg span.f{background:var(--blue)}.seg.done span.f{background:var(--green)}
.money{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.owe{font-weight:700;color:var(--orange)}.paid{font-weight:700;color:var(--green)}
.acts{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--tx);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.red{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn.grn{background:var(--green);border-color:var(--green);color:#052013}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn.danger{color:#FF8A94}
.grow{flex:1 1 220px}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:var(--mut)}.empty b{display:block;color:var(--tx);font-size:17px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);flex:1;min-width:110px}
label input,label select,label textarea,.mrow input{min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--tx);width:100%}
label textarea{padding:10px 14px;min-height:70px;resize:vertical}
label.chk{flex-direction:row;align-items:center;gap:10px;color:var(--tx);font-size:15px;min-width:0;flex:none}
label.chk input{width:22px;min-height:22px;accent-color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.err{color:#FF8A94;font-size:14px}
.ov{position:fixed;inset:0;z-index:60;background:rgba(3,6,12,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px;margin:auto}
.mbox h2{font-size:20px}
.li{display:grid;grid-template-columns:minmax(0,1fr) 70px 100px 90px 36px;gap:6px;align-items:center}
.li input{min-height:42px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel2);width:100%}
.li .la{text-align:right;font-variant-numeric:tabular-nums}
.lh{display:grid;grid-template-columns:minmax(0,1fr) 70px 100px 90px 36px;gap:6px;font-size:12px;color:var(--mut)}
@media(max-width:620px){.lh{display:none}.li{grid-template-columns:1fr 1fr 1fr;padding:10px 0;border-bottom:1px solid var(--line)}.li .ld{grid-column:1/-1}.li .la{grid-column:span 2;text-align:left}}
.helper{background:var(--panel2);border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tot{margin-left:auto;min-width:min(100%,280px);display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:16px}.tot .g{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.paperwrap{overflow:hidden;border-radius:12px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 12px;background:rgba(8,12,20,.94);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(6px)}
@media(min-width:1000px){.savebar{bottom:12px}}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mrow .mn{grid-column:1/-1}
.cap{display:flex;align-items:center;gap:6px;min-height:32px}
.rm{display:inline-flex;align-items:center;gap:4px;min-width:32px;min-height:32px;padding:0 6px;border:0;border-radius:10px;background:transparent;color:#FF8A94;justify-content:center}
.rm .rt{display:none;font-size:13px;font-weight:700}
.rm.arm{background:var(--red);color:var(--onred)}.rm.arm .rt{display:inline}
@media(min-width:720px){.mrow{grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr))}.mrow .mn{grid-column:auto}}
.res{background:linear-gradient(115deg,#1a0a10,#0E1522);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:4px}
.res b{font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}.res span{color:var(--mut);font-size:14px}
.auth{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth .wm{font-size:34px}
.in{color:var(--green)}.out{color:#FF6B78}
.day{font-size:13px;color:var(--mut);padding:10px 0 4px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ent .nm{flex:1;min-width:0;overflow-wrap:anywhere}.ent b{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;min-height:38px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--tx);font-size:14px}.chipb.fav{border-color:var(--orange)}
.chipb.on{background:var(--red);border-color:var(--red);color:#fff}
.more{display:grid;gap:10px}
.more .btn{justify-content:flex-start;min-height:56px;font-size:16px}
/* sidebar + bottom bar */
.bn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:2px;padding:6px;border-radius:24px;background:#0B1220;border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
.bn button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px;border:0;border-radius:18px;background:transparent;color:var(--mut);font-size:11.5px;font-weight:600;padding:4px 2px;position:relative}
.bn button.on{background:var(--red);color:var(--onred)}
.ni{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--tx);font-size:16px;text-align:left}
.ni.on{background:linear-gradient(90deg,var(--red),#9d1320)}
.ni em{margin-left:auto;font-style:normal;background:var(--red);color:var(--onred);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.ni.on em{background:#fff;color:var(--red)}
@media(min-width:1000px){
 .shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
 .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:calc(100vh - 28px)}
 .side nav{display:flex;flex-direction:column;gap:4px}
 .sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--mut)}
 .bn{display:none}.mwm{display:none}#app{padding-bottom:30px}
}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:active{filter:brightness(.9)}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,filter .15s}}
</style>
<div id="app"><p class="mut" style="padding:24px">กำลังโหลด…</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('th-TH');
const pad=n=>String(n).padStart(2,'0');
const ST=['รับงาน','ออกแบบ','รออนุมัติแบบ','ผลิต','พร้อมส่ง','ส่งมอบแล้ว'];
const STC=['#93A2BA','#A78BFA','#F5A524','#4C8DFF','#2FD07A','#93A2BA'];
const STI=['cart','pen','docs','print','box','truck'];
const TM=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TMF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DT={quote:['ใบเสนอราคา','QT'],invoice:['ใบแจ้งหนี้/ใบส่งของ','IV'],receipt:['ใบเสร็จรับเงิน','RC'],statement:['ใบวางบิล','BL']};
const DNOTE={quote:'ราคานี้ยืนยัน 15 วัน นับจากวันที่ออกเอกสาร',invoice:'กรุณาชำระเงินภายใน 7 วัน',receipt:'',statement:''};
const CIN=['รับชำระงาน','ขายหน้าร้าน','อื่นๆ'],COUT=['วัสดุ','หมึก/อุปกรณ์','ค่าแรง','ค่าเช่า','ค่าน้ำ-ไฟ','ขนส่ง','อื่นๆ'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mkey=s=>String(s||'').slice(0,7);
const dshort=s=>{const p=String(s||'').split('-');return p.length==3?(+p[2])+' '+TM[+p[1]-1]:''};
const dth=s=>{const p=String(s||'').split('-');return p.length==3?(+p[2])+' '+TM[+p[1]-1]+' '+(+p[0]+543):''};

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(v<=m*p)return m*p;return 10*p}
const fk=v=>v>=1000?(v/1000)+'k':String(v);
function chartSvg(k){
  const p=k.split('-'),dim=new Date(+p[0],+p[1],0).getDate(),last=k==today().slice(0,7)?+today().slice(8):dim;
  const ci=[],co=[];let a=0,b=0;
  for(let d=1;d<=last;d++){const ds=k+'-'+pad(d);ledger.forEach(e=>{if(e.date==ds){if(e.kind=='in')a+=+e.amt||0;else b+=+e.amt||0}});ci.push(a);co.push(b)}
  const W=640,H=230,L=46,R=12,T=12,B=26,pw=W-L-R,ph=H-T-B,mx=niceMax(Math.max(1,a,b));
  const X=i=>L+i*pw/Math.max(1,dim-1),Y=v=>T+ph-(v/mx)*ph;
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  let g='';for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#1F2B40"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#93A2BA">${fk(v)}</text>`}
  let xl='';for(let d=1;d<=dim;d+=3)xl+=`<text x="${X(d-1)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#93A2BA">${d}</text>`;
  const n=ci.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายรับและรายจ่ายสะสมของเดือน">${g}${xl}<path d="${path(ci)}L${X(n)} ${Y(0)}L${X(0)} ${Y(0)}Z" fill="#4C8DFF" opacity=".16"/><path d="${path(ci)}" fill="none" stroke="#4C8DFF" stroke-width="2.5"/><path d="${path(co)}" fill="none" stroke="#E11D2E" stroke-width="2"/><circle cx="${X(n)}" cy="${Y(ci[n])}" r="4" fill="#4C8DFF"/><circle cx="${X(n)}" cy="${Y(co[n])}" r="4" fill="#E11D2E"/></svg>`;
}
function donutSvg(items,total){
  const R=52,C=2*Math.PI*R;let off=0;
  const rings=items.map(it=>{const len=total?C*it.n/total:0;const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${it.c}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="สัดส่วนงานตามวัสดุ"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#1F2B40" stroke-width="18"/>${rings}<text x="70" y="68" text-anchor="middle" font-size="26" font-weight="700" fill="#EAF0FA">${total}</text><text x="70" y="88" text-anchor="middle" font-size="12" fill="#93A2BA">งานทั้งหมด</text></svg>`;
}

  openModal(`<h2>งานใหม่</h2>${chipsHtml('pickOrd')}<label>ชื่อลูกค้า<input id="fc" list="cdl" autocomplete="off" oninput="autoOrd(this)"></label><div class="row" style="gap:6px 20px"><label class="chk"><input type="checkbox" id="ffav">★ ลูกค้าประจำ</label><label class="chk"><input type="checkbox" id="fcr">เครดิต (วางบิลสิ้นเดือน)</label></div>${dlist()}<div class="row"><label>เบอร์โทร<input id="fp" type="tel" inputmode="tel"></label><label>กำหนดส่ง<input id="fdu" type="date"></label></div><div class="row"><label>LINE<input id="fl" placeholder="ไอดีไลน์ หรือ @..." autocomplete="off"></label><label>Facebook<input id="ff" placeholder="ชื่อ หรือลิงก์โปรไฟล์/เพจ" autocomplete="off"></label><label>TikTok<input id="ft" placeholder="@ชื่อ หรือลิงก์" autocomplete="off"></label></div><div id="items"></div><button type="button" class="btn" onclick="addItem()" style="width:100%;margin:2px 0 8px">+ เพิ่มรายการงาน</button><div class="mut" id="ftot" style="text-align:right;font-weight:600"></div><div class="row"><label>รับเงินมัดจำแล้ว (รวมทุกรายการ)<input id="fd" type="number" inputmode="numeric"></label></div>${payFld('f')}<span id="fe" class="err"></span><div class="row"><button class="btn red" onclick="saveOrder()">บันทึกงาน</button><button class="btn" onclick="closeModal()">ยกเลิก</button></div>`);
  window._fi=0;addItem();$('#fc').focus()}
const itemHtml=p=>`<div class="itm" data-p="${p}" style="border:1px solid var(--line,#2a3140);border-radius:12px;padding:10px;margin:0 0 10px"><div class="row" style="align-items:center;justify-content:space-between;margin-bottom:4px"><b class="itn"></b><button type="button" class="btn sm itx" onclick="delItem('${p}')">ลบรายการ</button></div><label>รายละเอียดงาน<input id="${p}j"></label><div class="row"><label>วัสดุ<select id="${p}m" onchange="fcalc('${p}')">${matOpts()}</select></label><label>ประเภทราคา<select id="${p}pt" onchange="fcalc('${p}')">${ptOpts()}</select></label><label>เครื่องพิมพ์<select id="${p}pn" onchange="fcalc('${p}')"><option value="">ไม่ระบุ</option>${printers().map(x=>`<option>${esc(x)}</option>`).join('')}</select></label></div><div class="row"><label>กว้าง (ซม.)<input id="${p}w" type="number" inputmode="decimal" oninput="fcalc('${p}')"></label><label>สูง (ซม.)<input id="${p}h" type="number" inputmode="decimal" oninput="fcalc('${p}')"></label><label>จำนวน<input id="${p}q" type="number" inputmode="decimal" value="1" oninput="fcalc('${p}')"></label><label>หน่วย<select id="${p}u" onchange="fcalc('${p}')">${uOpts()}</select></label></div><div class="mut" id="${p}area"></div><label>ราคา (แก้ได้)<input id="${p}pr" type="number" inputmode="numeric" oninput="ftot()"></label></div>`;
function itemNums(){const l=[...document.querySelectorAll('#items .itm')];l.forEach((e,i)=>{e.querySelector('.itn').textContent='รายการที่ '+(i+1);e.querySelector('.itx').style.display=l.length>1?'':'none'});ftot()}
function addItem(){const p='f'+(window._fi=(window._fi||0)+1);$('#items').insertAdjacentHTML('beforeend',itemHtml(p));fcalc(p);itemNums();const e=$('#'+p+'j');if(window._fi>1&&e)e.focus()}
function delItem(p){const e=document.querySelector('#items .itm[data-p="'+p+'"]');if(e)e.remove();itemNums()}
function ftot(){const l=[...document.querySelectorAll('#items .itm')];const t=l.reduce((a,e)=>a+(+$('#'+e.dataset.p+'pr').value||0),0);const bx=$('#ftot');if(bx)bx.textContent=l.length>1?'รวม '+l.length+' รายการ ฿'+fmt(t):''}
function fcalc(p){p=p||'f1';if(!$('#'+p+'m'))return;unitUi(p+'w',p+'h',p+'u');areaUi(p);$('#'+p+'pr').value=quote($('#'+p+'m').value,+$('#'+p+'w').value,+$('#'+p+'h').value,+$('#'+p+'q').value||1,$('#'+p+'pt').value,$('#'+p+'u').value,$('#'+p+'pn').value).p||'';ftot()}
async function saveOrder(){const g=i=>$('#'+i).value;if(!g('fc').trim()){$('#fc').focus();$('#fe').textContent='กรอกชื่อลูกค้าก่อน';return}
  const ym=yymm(),pre='JB-'+ym+'-';let n=orders.filter(o=>String(o.no||'').startsWith(pre)).length+1;while(orders.some(o=>o.no==pre+String(n).padStart(3,'0')))n++;
  const cust=g('fc').trim();let its=[...document.querySelectorAll('#items .itm')].map(e=>{const p=e.dataset.p;return{job:g(p+'j').trim(),mat:g(p+'m'),ptype:g(p+'pt'),printer:g(p+'pn'),unit:g(p+'u'),w:+g(p+'w')||0,h:+g(p+'h')||0,qty:+g(p+'q')||1,price:+g(p+'pr')||0}});
  if(its.length>1)its=its.filter(x=>x.job||x.price||x.w||x.h);if(!its.length)its=[{job:'',mat:g('f1m'),ptype:'',printer:'',unit:'pc',w:0,h:0,qty:1,price:0}];
  let left=+g('fd')||0;rememberCust(cust,g('fp').trim(),'',{line:g('fl').trim(),fb:g('ff').trim(),tt:g('ft').trim(),fav:$('#ffav').checked,credit:$('#fcr').checked});
  const pm=payRead('f');
  try{for(let i=0;i<its.length;i++){const x=its[i];const dep=i==its.length-1?left:Math.min(left,x.price);left-=dep;
    const ref=await db.collection('orders').add({no:pre+String(n+i).padStart(3,'0'),customer:cust,phone:g('fp').trim(),line:g('fl').trim(),fb:g('ff').trim(),tt:g('ft').trim(),job:x.job,mat:x.mat,ptype:x.ptype,printer:x.printer,unit:x.unit,w:x.w,h:x.h,qty:x.qty,price:x.price,deposit:dep,due:g('fdu'),method:pm.method,bank:pm.bank,status:ST[0],created:Date.now()+i});
    if(dep>0)await db.collection('ledger').add({date:today(),kind:'in',cat:'รับชำระงาน',amt:dep,note:cust+(x.job?' · '+x.job:'')+' (มัดจำ) · '+pm.txt,method:pm.method,bank:pm.bank,orderId:ref.id,created:Date.now()+i})}
    closeModal()}catch(e){$('#fe').textContent='บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'}}
const BANKS=['บัญชีร้าน','บัญชีบริษัท','กสิกรไทย','ไทยพาณิชย์','กรุงเทพ','กรุงไทย','กรุงศรี','ทหารไทยธนชาต (ttb)','ออมสิน','พร้อมเพย์','อื่น ๆ'];
const payFld=p=>`<div class="row"><label>วิธีรับเงิน<select id="${p}pm" onchange="$('#${p}bk').parentNode.style.display=this.value=='transfer'?'':'none'"><option value="cash">เงินสด</option><option value="transfer">เงินโอน</option></select></label><label style="display:none">โอนเข้าธนาคาร<select id="${p}bk">${BANKS.map(b=>`<option>${b}</option>`).join('')}</select></label></div>`;
const payRead=p=>{const t=$('#'+p+'pm')&&$('#'+p+'pm').value=='transfer',b=t?$('#'+p+'bk').value:'';return{method:t?'transfer':'cash',bank:b,txt:t?'เงินโอน'+(b?' '+b:''):'เงินสด'}};
function openPay(id){const o=orders.find(x=>x.id==id);if(!o)return;
  openModal(`<h2>รับเงิน</h2><p class="mut">${esc(o.customer)} · ${esc(o.job)}<br>ราคา ${fmt(o.price)} · ชำระแล้ว ${fmt(o.deposit)} · ค้าง ${fmt(rest(o))}</p><div class="row"><label>จำนวนเงินที่รับ<input id="pa" type="number" inputmode="numeric" value="${rest(o)}"></label><label>วันที่รับ<input id="pd" type="date" value="${today()}"></label></div>${payFld('p')}<span id="pe" class="err"></span><div class="row"><button class="btn grn" onclick="savePay('${id}')">บันทึกรับเงิน</button><button class="btn" onclick="closeModal()">ยกเลิก</button></div>`);$('#pa').select()}
async function savePay(id){const o=orders.find(x=>x.id==id),a=+$('#pa').value;if(!o||!(a>0)){$('#pe').textContent='ใส่จำนวนเงินมากกว่า 0';return}
  try{const pm=payRead('p');await db.doc('orders/'+id).update({deposit:(o.deposit||0)+a,method:pm.method,bank:pm.bank});await db.collection('ledger').add({date:$('#pd').value||today(),kind:'in',cat:'รับชำระงาน',amt:a,note:o.customer+(o.job?' · '+o.job:'')+' · '+pm.txt,method:pm.method,bank:pm.bank,orderId:id,created:Date.now()});closeModal()}catch(e){$('#pe').textContent='บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'}}
/* ---------- documents ---------- */
function calcDoc(d){const sub=(d.items||[]).reduce((s,x)=>s+(+x.q||0)*(+x.u||0),0),disc=+d.disc||0,base=Math.max(0,sub-disc),vat=d.vat?Math.round(base*.07):0,total=base+vat,paid=+d.paid||0;return{sub,disc,base,vat,total,paid,bal:total-paid}}
function docsV(){
  const l=docs.filter(d=>dfil=='all'||d.type==dfil).sort((a,b)=>(b.created||0)-(a.created||0));
  const chips=[['all','ทั้งหมด']].concat(Object.keys(DT).map(k=>[k,DT[k][0]]));
  return `<button class="bigadd" onclick="newDoc()">${svg('plus',28)}สร้างเอกสาร</button><div class="bar"><div class="tiles" style="flex:1">${chips.map(c=>`<button class="tile${dfil==c[0]?' on':''}" onclick="dfil='${c[0]}';render(true)"><b>${c[0]=='all'?docs.length:docs.filter(d=>d.type==c[0]).length}</b><span>${c[1]}</span></button>`).join('')}</div></div><div class="panel"><div class="tw"><table class="t"><thead><tr><th>เลขที่</th><th>ประเภท</th><th>ลูกค้า</th><th>วันที่</th><th class="num">ยอดรวม</th><th></th></tr></thead><tbody>${l.map(d=>`<tr><td>${esc(d.no)}</td><td><span class="badge" style="--c:${d.type=='quote'?'#4C8DFF':d.type=='invoice'?'#F5A524':d.type=='statement'?'#A78BFA':'#2FD07A'}">${DT[d.type]?DT[d.type][0]:''}</span></td><td>${esc(d.customer)}</td><td>${dshort(d.date)}</td><td class="num">${fmt(d.total)}</td><td><button class="btn sm" onclick="viewDoc('${d.id}')">เปิด</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">ยังไม่มีเอกสาร กด "สร้างเอกสาร" เพื่อทำใบเสนอราคา</td></tr>'}</tbody></table></div></div>`;
}
function newDoc(){df={type:'quote',date:today(),customer:'',phone:'',addr:'',items:[{d:'',q:1,u:0}],disc:0,vat:false,paid:0,note:DNOTE.quote,orderId:''};openModal(docFormHtml())}
const creditOrdersOf=name=>orders.filter(o=>nkey(o.customer)==nkey(name)&&rest(o)>0).sort((a,b)=>(a.created||0)-(b.created||0));
const stmtItem=o=>{const q=+o.qty||1;return{d:o.job||'งาน',q,u:Math.round((o.price||0)/q*1e6)/1e6,n:UL[o.unit||'pc']}};
const methodOf=ids=>{const l=ledger.filter(x=>x.kind=='in'&&ids.includes(x.orderId)&&x.method).sort((a,b)=>(b.created||0)-(a.created||0))[0];if(l)return{method:l.method,bank:l.bank||''};const o=orders.filter(x=>ids.includes(x.id)&&x.method).sort((a,b)=>(b.created||0)-(a.created||0))[0];return o?{method:o.method,bank:o.bank||''}:{method:'',bank:''}};
const depSum=os=>os.reduce((s,o)=>s+(+o.deposit||0),0);
function addCreditOrders(){
  if(!df.customer.trim()){$('#dcu').focus();$('#de').textContent='กรอกชื่อลูกค้าก่อน';return}
  const have=df.orderIds||[],os=creditOrdersOf(df.customer).filter(o=>o.id!=df.orderId&&!have.includes(o.id));
  if(!os.length){$('#de').textContent='ไม่พบงานค้างชำระอื่นของลูกค้านี้';return}
  if(df.items.length==1&&!df.items[0].d&&!+df.items[0].u)df.items=[];
  os.forEach(o=>df.items.push(stmtItem(o)));df.paid=(+df.paid||0)+depSum(os);
  df.orderIds=have.concat(os.map(o=>o.id));if(df.orderId&&!df.orderIds.includes(df.orderId))df.orderIds.push(df.orderId);
  setModalDoc()}
function docFromOrder(id){const o=orders.find(x=>x.id==id);if(!o)return;
  const cu=findCust(o.customer);
  if(cu&&cu.credit&&rest(o)>0){const os=creditOrdersOf(cu.name),mk=today().split('-'),end=new Date(+mk[0],+mk[1],+cu.cdays||30),due=end.getFullYear()+'-'+pad(end.getMonth()+1)+'-'+pad(end.getDate());
    df={type:'statement',date:today(),customer:cu.name,phone:cu.phone||o.phone||'',addr:cu.addr||'',tax:cu.tax||'',items:os.map(stmtItem),disc:0,vat:false,paid:depSum(os),note:'ครบกำหนดชำระ '+dth(due)+' (เครดิต '+(cu.cdays||30)+' วัน)',orderIds:os.map(x=>x.id),pt:'',...methodOf(os.map(x=>x.id))};openModal(docFormHtml());return}
  df={type:'quote',date:today(),customer:o.customer||'',phone:o.phone||'',addr:'',items:[{d:(o.job||'งาน')+' ('+o.mat+(ordSize(o)?' '+ordSize(o):'')+')',q:o.qty||1,u:Math.round((o.price||0)/(o.qty||1)),n:UL[o.unit||'pc']}],disc:0,vat:false,paid:o.deposit||0,note:DNOTE.quote,orderId:id,pt:o.ptype||'',...methodOf([id])};openModal(docFormHtml())}
function docFormHtml(){
  const rows=df.items.map((it,i)=>`<div class="li"><input class="ld" aria-label="รายละเอียด" placeholder="รายละเอียด เช่น ป้ายไวนิล 300×100 ซม." value="${esc(it.d)}" oninput="df.items[${i}].d=this.value"><input type="number" inputmode="decimal" aria-label="จำนวน" value="${it.q}" oninput="df.items[${i}].q=+this.value;updTot()"><input type="number" inputmode="decimal" aria-label="ราคาต่อหน่วย" value="${it.u}" oninput="df.items[${i}].u=+this.value;updTot()"><b class="la" id="la${i}">${fmt(it.q*it.u)}</b><button type="button" class="icb sm" aria-label="ลบรายการ" onclick="delLine(${i})">${svg('trash',16)}</button></div>`).join('');
  return `<h2>สร้างเอกสาร</h2><div class="row"><label>ประเภท<select id="dtp" onchange="chgType(this.value)">${Object.keys(DT).map(k=>`<option value="${k}"${df.type==k?' selected':''}>${DT[k][0]}</option>`).join('')}</select></label><label>หัวบิล<select id="dhd" onchange="df.head=this.value">${[['shop','ร้านธรรมดา'],['co','บริษัท']].map(x=>`<option value="${x[0]}"${(df.head||'shop')==x[0]?' selected':''}>${x[1]}</option>`).join('')}</select></label><label>วันที่<input type="date" value="${df.date}" oninput="df.date=this.value"></label></div>${chipsHtml('pickDoc')}<div class="row"><label>ชื่อลูกค้า<input id="dcu" list="cdl" autocomplete="off" value="${esc(df.customer)}" oninput="df.customer=this.value;autoDoc(this)"></label><label>เบอร์โทร<input id="dph" type="tel" value="${esc(df.phone)}" oninput="df.phone=this.value"></label></div><div class="row" style="gap:6px 20px"><label class="chk"><input type="checkbox" id="dfav"${(df.fav!==undefined?df.fav:(findCust(df.customer)||{}).fav)?' checked':''} onchange="df.fav=this.checked">★ ลูกค้าประจำ</label><label class="chk"><input type="checkbox" id="dcr"${(df.credit!==undefined?df.credit:(findCust(df.customer)||{}).credit)?' checked':''} onchange="df.credit=this.checked">เครดิต (วางบิลสิ้นเดือน)</label></div>${dlist()}<label>ที่อยู่ลูกค้า (ถ้ามี)<input id="dad" value="${esc(df.addr)}" oninput="df.addr=this.value"></label><label>เลขประจำตัวผู้เสียภาษีลูกค้า (ถ้ามี)<input id="dtx" inputmode="numeric" value="${esc(df.tax||'')}" oninput="df.tax=this.value"></label>
<div class="helper"><b style="font-size:14px">ตัวช่วยคิดราคาจากวัสดุ</b><div class="row"><label>วัสดุ<select id="hm">${matOpts()}</select></label><label>ประเภทราคา<select id="hpt" onchange="df.pt=this.value">${ptOpts(df.pt)}</select></label></div><div class="row"><label>กว้าง (ซม.)<input id="hw" type="number" inputmode="decimal" oninput="areaUi('h')"></label><label>สูง (ซม.)<input id="hh" type="number" inputmode="decimal" oninput="areaUi('h')"></label><label>จำนวน<input id="hq" type="number" inputmode="decimal" value="1" oninput="areaUi('h')"></label><label>หน่วย<select id="hu" onchange="unitUi('hw','hh','hu');areaUi('h')">${uOpts()}</select></label><button type="button" class="btn" onclick="addFromMat()">เพิ่มเป็นรายการ</button></div><div class="mut" id="harea"></div></div>
<div class="lh"><span>รายละเอียด</span><span>จำนวน</span><span>ราคา/หน่วย</span><span style="text-align:right">รวม</span><span></span></div>${rows}<div class="acts"><button type="button" class="btn sm" onclick="addLine()">${svg('plus',16)}เพิ่มรายการ</button><button type="button" class="btn sm" onclick="addCreditOrders()">รวมงานค้างทั้งหมดของลูกค้านี้ลงบิลเดียว</button></div>
<div class="row"><label>ส่วนลด (บาท)<input type="number" inputmode="decimal" value="${df.disc||''}" oninput="df.disc=+this.value;updTot()"></label><label>ชำระแล้ว/มัดจำ (บาท)<input type="number" inputmode="decimal" value="${df.paid||''}" oninput="df.paid=+this.value;updTot()"></label><label class="chk"><input type="checkbox"${df.vat?' checked':''} onchange="df.vat=this.checked;updTot()">คิด VAT 7%</label></div><div class="row"><label>วิธีรับเงิน (แสดงในใบเสร็จ)<select onchange="df.method=this.value;if(this.value=='transfer'){df.bank=df.bank||BANKS[0]}else df.bank='';$('#dbk').parentNode.style.display=this.value=='transfer'?'':'none';$('#dbk').value=df.bank||BANKS[0]"><option value="">ไม่ระบุ</option><option value="cash"${df.method=='cash'?' selected':''}>เงินสด</option><option value="transfer"${df.method=='transfer'?' selected':''}>เงินโอน</option></select></label><label style="${df.method=='transfer'?'':'display:none'}">โอนเข้าบัญชี/ธนาคาร<select id="dbk" onchange="df.bank=this.value">${BANKS.map(b=>`<option${(df.bank||BANKS[0])==b?' selected':''}>${b}</option>`).join('')}</select></label></div><div class="tot" id="tot"></div><label>หมายเหตุ<textarea oninput="df.note=this.value">${esc(df.note)}</textarea></label><span id="de" class="err"></span><div class="row"><button class="btn red" onclick="saveDoc()">บันทึกเอกสาร</button><button class="btn" onclick="previewDoc()">${svg('docs',18)}ดูตัวอย่างก่อนบันทึก</button><button class="btn" onclick="closeModal()">ยกเลิก</button></div>`;
}
function updTot(){const t=calcDoc(df);df.items.forEach((x,i)=>{const e=$('#la'+i);if(e)e.textContent=fmt((+x.q||0)*(+x.u||0))});const e=$('#tot');if(e)e.innerHTML=`<div><span>รวมเป็นเงิน</span><span>${fmt(t.sub)}</span></div>${t.disc?`<div><span>ส่วนลด</span><span>-${fmt(t.disc)}</span></div>`:''}${t.vat?`<div><span>VAT 7%</span><span>${fmt(t.vat)}</span></div>`:''}<div class="g"><span>ยอดรวมสุทธิ</span><span>฿${fmt(t.total)}</span></div>${t.paid?`<div><span>ชำระแล้ว</span><span>-${fmt(t.paid)}</span></div><div><span>คงเหลือ</span><span>${fmt(t.bal)}</span></div>`:''}`}
const setModalDoc=()=>{setModal(docFormHtml());updTot()};
function chgType(v){if(df.note==DNOTE[df.type]||!df.note)df.note=DNOTE[v];df.type=v;setModalDoc()}
function addLine(){df.items.push({d:'',q:1,u:0});setModalDoc()}
function delLine(i){df.items.splice(i,1);if(!df.items.length)df.items.push({d:'',q:1,u:0});setModalDoc()}
function addFromMat(){const n=$('#hm').value,u=$('#hu').value,w=+$('#hw').value,h=+$('#hh').value,q=+$('#hq').value||1,t=$('#hpt').value;
  if(!n||(u!='sqm'&&!w)||(u=='pc'&&!h)){(w?$('#hh'):$('#hw')).focus();return}
  const r=quote(n,w,h,q,t,u),sz=u=='pc'?'':u=='m'?' กว้าง '+w+' ซม.':'',it={d:n+sz+(t=='ws'?' (ราคาส่ง)':''),q,u:Math.round(r.p/q),n:u=='pc'?'':UL[u]};

function paper(d){
  const s=shop(d.head),t=calcDoc(d),isR=d.type=='receipt',sz=paperSize(d),minR=sz=='a5'?3:12,bt=bankText(s);
  const ct=[s.addr?esc(s.addr):'',s.tel?'โทร.<b>'+esc(s.tel)+'</b>':'',s.line?'LINE: '+esc(s.line):'',s.fb?'Facebook: '+esc(s.fb):''].filter(Boolean);
  const rows=(d.items||[]).map((x,i)=>`<tr><td class="c">${i+1}</td><td>${esc(x.d)}</td><td class="c">${fmt(x.q)}${x.n?' '+esc(x.n):''}</td><td class="r">${fmt2(x.u)}</td><td class="r">${fmt2(x.q*x.u)}</td></tr>`).join('')+Array(Math.max(0,minR-(d.items||[]).length)).fill('<tr class="e"><td></td><td></td><td></td><td></td><td></td></tr>').join('');
  const cl=[['ลูกค้า',d.customer],['ที่อยู่',d.addr],['โทร',d.phone],['เลขผู้เสียภาษี',d.tax]].filter(x=>x[1]).map(x=>`<div><b>${x[0]}</b><span>${esc(x[1])}</span></div>`).join('');
  const note=d.note?`<div class="nt"><b>หมายเหตุ</b><div>${esc(d.note).replace(/\n/g,'<br>')}</div></div>`:'';
  const tot=`<div class="tt2"><div><span>รวมเป็นเงิน</span><span>${fmt2(t.sub)}</span></div>${t.disc?`<div><span>ส่วนลด</span><span>-${fmt2(t.disc)}</span></div>`:''}${t.vat?`<div><span>ภาษีมูลค่าเพิ่ม 7%</span><span>${fmt2(t.vat)}</span></div>`:''}<div class="g"><span>ยอดรวมทั้งสิ้น</span><span>${fmt2(t.total)}</span></div>${t.paid&&!isR?`<div><span>ชำระแล้ว</span><span>-${fmt2(t.paid)}</span></div><div class="g2"><span>คงเหลือ</span><span>${fmt2(t.bal)}</span></div>`:''}</div>`;
  const pay=isR?`<div class="pay"><b>ชำระโดย</b>${[['cash','เงินสด'],['transfer','โอนเงิน'+(d.method=='transfer'&&d.bank?' ('+esc(d.bank)+')':'')]].map(x=>`<span><u${d.method==x[0]?' class="on"':''}>${d.method==x[0]?'✓':''}</u>${x[1]}</span>`).join('')}</div>`:'';
  const bank=bt?`<div class="bk"><b>ช่องทางชำระเงิน</b><div>${esc(bt)}</div></div>`:'';
  const L=d.type=='quote'?['ผู้เสนอราคา','ผู้อนุมัติสั่งซื้อ']:d.type=='statement'?['ผู้วางบิล','ผู้รับวางบิล']:d.type=='invoice'?['ผู้รับสินค้า','ผู้รับมอบอำนาจ']:['ผู้รับเงิน','ผู้ชำระเงิน'];
  return `<div class="paper ${sz} t0">${d.head=='co'?`<div class="hd img"><img src="${COHDR}" alt="" style="width:80%;margin:0 auto;display:block"></div>`:`<div class="hd img"><img src="${SHOPHDR}" alt="" style="width:80%;margin:0 auto;display:block"></div>`}
<div class="tl"><div><h1>${DT[d.type][0]}</h1><em>${DEN[d.type]}</em></div><div class="mt"><div><b>เลขที่</b><span>${esc(d.no)}</span></div><div><b>วันที่</b><span>${dth(d.date)}</span></div></div></div>
<div class="cu">${cl}</div>
<table><thead><tr><th class="c" style="width:9%">ลำดับ</th><th>รายการสินค้า / บริการ</th><th class="c" style="width:12%">จำนวน</th><th class="c" style="width:16%">หน่วยละ</th><th class="c" style="width:19%">รวมเงิน (บาท)</th></tr></thead><tbody>${rows}</tbody></table>
<div class="bt2"><div class="lf">${note}</div>${tot}</div>${pay}${bank}
<div class="sg" style="margin-top:3.4em"><div>${d.type!='invoice'?`<img class="sgimg" src="${SIGIMG}" alt="">`:''}<span>(........................................)</span>${L[0]}</div><div>${d.type=='invoice'?`<img class="sgimg" src="${SIGIMG}" alt="">`:''}<span>(........................................)</span>${L[1]}</div></div>
<div class="ft"><div class="fl">${esc(s.name)}</div><div class="fc">${[s.tel?CI(CIP.tel)+esc(s.tel):'',s.line?CI(CIP.line)+esc(s.line):'',s.fb?CI(CIP.fb)+esc(s.fb):''].filter(Boolean).map(x=>`<span>${x}</span>`).join('')}</div></div></div>`;
}
const PCORE=`.paper{--bl:#1D6FD8;--bg:#eef3f9;position:relative;display:flex;flex-direction:column;gap:.85em;box-sizing:border-box;padding:1.6em 1.8em 0;background:#fff;color:#1b2430;font-family:Anuphan,"Noto Sans Thai",Tahoma,sans-serif;line-height:1.45;overflow:hidden;text-align:left}
.paper.a4{width:794px;min-height:1120px;font-size:14px}.paper.a5{width:794px;min-height:559px;font-size:11.5px}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 0 0,#dcebfc 0,transparent 42%),radial-gradient(ellipse at 100% 100%,#d4e5fa 0,transparent 38%)}
.paper>*{position:relative}.paper *{box-sizing:border-box}
.paper .hd{display:flex;justify-content:space-between;align-items:center;gap:1.2em}
.paper .lg{display:flex;flex-direction:column;gap:.2em}.paper .lg small{font-size:.72em;color:#4a5668}
.paper .lgi{max-height:5.2em;max-width:16em;object-fit:contain;display:block}
.paper .lgt{font-style:italic;line-height:.95}.paper .lgt b{display:block;font-size:3.1em;font-weight:900;letter-spacing:-.04em;color:#2b3340}.paper .lgt i{display:block;font-size:1.5em;font-weight:800;color:var(--bl)}
.paper .cts{display:flex;flex-direction:column;gap:.35em;padding-left:1.2em;border-left:1px solid #cdd6e2;font-size:.92em;max-width:55%}
.paper .cts>div{display:flex;align-items:center;gap:.55em}
.paper .ci{flex:none;display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:.4em;background:var(--bl);margin-right:.5em}.paper .ci svg{width:1.05em;height:1.05em}
.paper .cts .ci{margin-right:0}
.paper .tl{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;margin-top:.4em}
.paper h1{margin:0;font-size:2.3em;line-height:1.15;font-weight:800;color:#222a35}.paper .tl em{display:block;font-style:normal;font-size:1.35em;font-weight:700;letter-spacing:.04em;color:#9aa4b2}
.paper .mt{background:var(--bg);border-radius:.7em;padding:.6em 1em;min-width:42%}

  const r0=L[0],ltx=ci?'ø'+(+pw.toFixed(2)):(+(r0.w).toFixed(2))+'×'+(+(r0.h).toFixed(2));
  const lab=r0.w>fs*2.4&&r0.h>fs*1.4?`<text x="${f1(P+mg+r0.x+dx+r0.w/2)}" y="${f1(P+mg+r0.y+dy+r0.h/2)}" font-size="${f1(Math.min(fs*.8,r0.w/5))}" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">${ltx}</text>`:'';
  const sn=ci?'วงกลม เส้นผ่านศูนย์กลาง '+(+pw.toFixed(2))+' ซม.':(sp=='ellipse'?'วงรี ':'สี่เหลี่ยม ')+(+pw.toFixed(2))+' × '+(+ph.toFixed(2))+' ซม.';
  V.innerHTML=`<svg viewBox="0 0 ${f1(vw)} ${f1(vh)}" style="width:100%;max-height:420px;display:block;background:#0B1220;border-radius:12px" role="img" aria-label="ภาพจำลองกระดาษและการเรียงชิ้นงาน"><rect x="${f1(P+sk*3)}" y="${f1(P+sk*3)}" width="${sw}" height="${sh}" fill="#000" opacity=".35"/><rect x="${P}" y="${P}" width="${sw}" height="${sh}" fill="#F4F6FA" stroke="#B8C2D1" stroke-width="${sk}"/>${mg>0?`<rect x="${f1(P+mg)}" y="${f1(P+mg)}" width="${f1(W)}" height="${f1(H)}" fill="none" stroke="#E11D2E" stroke-width="${sk}" stroke-dasharray="${sk*4} ${sk*3}"/>`:''}${L.map(shp).join('')}${lab}${dim(P,P*.5,P+sw,P*.5,'กว้าง '+(+sw.toFixed(2))+' ซม.',false)}${dim(P*.5,P,P*.5,P+sh,'สูง '+(+sh.toFixed(2))+' ซม.',true)}</svg><p class="mut">กระดาษ ${+sw.toFixed(2)} × ${+sh.toFixed(2)} ซม. · ชิ้นงาน ${sn}${rt?' · ฟ้า = แนวเดิม ส้ม = หมุน 90 องศา':''}${mg>0?' · เส้นประแดง = ขอบที่เว้นไว้':''} · เป็นค่าประมาณ ไม่รวมช่องเผื่อตัด</p>`}
/* ---------- settings ---------- */
const mrow=m=>`<div class="mrow m"><div style="grid-column:1/-1;display:flex;gap:12px;align-items:flex-end"><label class="mn" style="flex:1;min-width:0"><span class="cap">ชื่อวัสดุ<button type="button" class="rm" aria-label="ลบวัสดุนี้" title="ลบวัสดุนี้" onclick="rmM(this)">${svg('trash',17)}<span class="rt">ลบ?</span></button></span><input placeholder="เช่น ไวนิล" value="${esc(m.n)}"></label><label style="flex:none;min-width:0;width:110px">คิดราคาต่อ<select class="pu"><option value="sqm"${m.pu!='m'&&m.pu!='pc'?' selected':''}>ตร.ม.</option><option value="m"${m.pu=='m'?' selected':''}>เมตร</option><option value="pc"${m.pu=='pc'?' selected':''}>ชิ้น</option></select></label></div><label>ราคาหน้าร้าน<input type="number" inputmode="decimal" value="${m.sell??''}"></label><label>ราคาส่ง<input type="number" inputmode="decimal" value="${m.ws??''}"></label><label>ต้นทุน<input type="number" inputmode="decimal" value="${m.cost??''}"></label></div>`;
const prof=(p,s,title,co)=>{const lg=window._lg&&window._lg[p]!==undefined?window._lg[p]:s.logo;return `<div class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>${title}</h2><label>${co?'ชื่อบริษัท':'ชื่อร้าน'}<input id="${p}n" value="${esc(s.name)}"></label><label>ที่อยู่<input id="${p}a" value="${esc(s.addr)}"></label><div class="row"><label>เบอร์โทร<input id="${p}t" value="${esc(s.tel)}"></label><label>${co?'เลขประจำตัวผู้เสียภาษี':'เลขผู้เสียภาษี (ถ้ามี)'}<input id="${p}x" value="${esc(s.tax)}"></label></div>${co?`<label>สำนักงานใหญ่ / สาขา<input id="${p}br" placeholder="เช่น สำนักงานใหญ่ หรือ สาขาที่ 00001" value="${esc(s.br)}"></label>`:''}<label>สโลแกนใต้โลโก้<input id="${p}g" value="${esc(s.tag)}"></label><div class="row"><label>LINE<input id="${p}l" placeholder="@mtsuphan" value="${esc(s.line)}"></label><label>Facebook<input id="${p}f" value="${esc(s.fb)}"></label></div><div class="row"><label>ธนาคาร<input id="${p}bn" placeholder="เช่น กสิกรไทย" value="${esc(s.bankName)}"></label><label>เลขบัญชี<input id="${p}bo" value="${esc(s.bankNo)}"></label></div><label>ชื่อบัญชี<input id="${p}ba" value="${esc(s.bankAcc)}"></label><label>ช่องทางชำระเงินอื่น (ข้อความ ใช้เมื่อไม่ได้กรอกเลขบัญชีด้านบน)<input id="${p}b" value="${esc(s.bank)}"></label><label>โลโก้ (แสดงบนเอกสาร)</label><div class="row" style="align-items:center"><img id="${p}lp" alt="" src="${esc(lg)}" style="max-height:56px;max-width:140px;background:#fff;border-radius:8px;padding:4px;${lg?'':'display:none'}"><input type="file" accept="image/*" onchange="pickLogo(this,'${p}')"><button class="btn sm" type="button" onclick="clearLogo('${p}')">ลบโลโก้</button></div></div>`};
function setV(){const s=shop(),c=Object.assign({},SHD,{name:'',tag:'',br:'สำนักงานใหญ่'},cfg.co||{});return `<div class="g2 even">${prof('s_',s,'หัวบิล: ร้านธรรมดา')}${prof('c_',c,'หัวบิล: บริษัท',true)}</div><div class="g2 even"><div class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>วัสดุและราคา</h2><div id="ml" style="display:flex;flex-direction:column;gap:8px">${cfg.materials.map(mrow).join('')}</div><button class="btn sm" style="align-self:flex-start" onclick="addM()">${svg('plus',16)}เพิ่มวัสดุ</button><p class="mut">เลือกหน่วยที่คิดราคา ตร.ม. เมตร หรือชิ้น ถ้าไม่ใส่ราคาส่ง ระบบจะใช้ราคาหน้าร้านแทน พนักงานจะไม่เห็นต้นทุน กดรูปถังขยะข้างชื่อวัสดุสองครั้งเพื่อลบทันที งานเก่าที่ใช้วัสดุนั้นยังแสดงตามเดิม</p></div><div class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>เครื่องพิมพ์</h2><div id="prl" style="display:flex;flex-direction:column;gap:8px">${printers().map(prRow).join('')}</div><button class="btn sm" style="align-self:flex-start" onclick="addPr()">${svg('plus',16)}เพิ่มเครื่องพิมพ์</button><p class="mut">ชื่อเครื่องจะขึ้นเป็นตัวเลือกตอนเพิ่มงานใหม่ และใช้กรองงานในหน้า "งานทั้งหมด" ได้ ลบเครื่องออกแล้ว งานเก่ายังแสดงชื่อเครื่องเดิม</p></div></div></div><div class="panel"><h2>สำรองข้อมูล</h2><p class="mut">ดาวน์โหลดข้อมูลทั้งหมด (งาน เอกสาร ลูกค้า รายรับรายจ่าย และการตั้งค่า) เก็บไว้เป็นไฟล์ แนะนำให้ทำทุกสัปดาห์</p><button class="btn" onclick="backupData(this)">ดาวน์โหลดสำรองข้อมูล</button><div class="mut" id="bkm"></div></div><div class="row savebar"><button class="btn red" onclick="saveSet(this)">บันทึกการตั้งค่า</button></div>`}
function pickLogo(inp,p){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');if(u.length>700000)u=c.toDataURL('image/jpeg',.85);(window._lg=window._lg||{})[p]=u;const e=$('#'+p+'lp');e.src=u;e.style.display='block'};im.src=r.result};r.readAsDataURL(f)}
function clearLogo(p){(window._lg=window._lg||{})[p]='';const e=$('#'+p+'lp');if(e){e.removeAttribute('src');e.style.display='none'}}
const prRow=x=>`<div class="row" style="align-items:center;flex-wrap:nowrap"><input class="fld pr" placeholder="ชื่อเครื่องพิมพ์" value="${esc(x)}"><button type="button" class="icb sm" aria-label="ลบเครื่องพิมพ์" onclick="this.parentNode.remove()">${svg('trash',16)}</button></div>`;
function addPr(){$('#prl').insertAdjacentHTML('beforeend',prRow(''))}
function addM(){$('#ml').insertAdjacentHTML('beforeend',mrow({}))}
async function saveSet(b){const ms=[...document.querySelectorAll('.m')].map(r=>{const i=r.querySelectorAll('input');return{n:i[0].value.trim(),sell:+i[1].value||0,ws:+i[2].value||0,cost:+i[3].value||0,pp:{},pu:r.querySelector('.pu').value}}).filter(m=>m.n);
  const rd=(p,old)=>{const g=k=>($('#'+p+k)?$('#'+p+k).value.trim():'');const lg=window._lg&&window._lg[p]!==undefined?window._lg[p]:((old&&old.logo)||'');return{name:g('n'),addr:g('a'),tel:g('t'),tax:g('x'),br:g('br'),tag:g('g'),line:g('l'),fb:g('f'),bankName:g('bn'),bankNo:g('bo'),bankAcc:g('ba'),bank:g('b'),logo:lg}};
  const sh=rd('s_',cfg.shop);sh.name=sh.name||'MT Sticker suphan';const co=rd('c_',cfg.co);
  try{await db.doc('settings/main').set({...cfg,materials:ms,shop:sh,co,printers:[...document.querySelectorAll('.pr')].map(i=>i.value.trim()).filter(Boolean)});if(b)b.textContent='บันทึกแล้ว';window._lg={};return true}catch(e){if(b)b.textContent='ไม่สำเร็จ ลองใหม่';return false}}
async function rmM(b){
  if(!b.classList.contains('arm')){b.classList.add('arm');b.setAttribute('aria-label','กดอีกครั้งเพื่อยืนยันการลบ');setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.setAttribute('aria-label','ลบวัสดุนี้')}},4000);return}
  const row=b.closest('.mrow'),next=row.nextSibling;row.remove();
  if(!(await saveSet(null))){$('#ml').insertBefore(row,next);b.classList.remove('arm')}}
function moreV(){const o=role=='owner';return `<div class="more">${[['customers','ลูกค้า','users'],['credit','เครดิต วางบิล','coins']].concat(role=='owner'?[]:[]).concat([['calc','คิดราคา','calc']]).concat(o?[['set','ตั้งค่า','set']]:[]).map(n=>`<button class="btn" onclick="go('${n[0]}')">${svg(n[2],22)}${n[1]}</button>`).join('')}<button class="btn" onclick="openKalc()">${svg('calc',22)}เครื่องคิดเลข</button><button class="btn danger" onclick="logout()">${svg('out',22)}ออกจากระบบ</button></div>`}
init();
</script>
